<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BarangAI</title>
    <script>
      // Apply the saved or device theme before first paint (lib/theme.tsx keeps it in sync after).
      try {
        var choice = localStorage.getItem('barangai-theme')
        if (choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
