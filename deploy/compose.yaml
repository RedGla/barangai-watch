services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barangai
      POSTGRES_USER: barangai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barangai -d barangai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../deploy/Dockerfile.api
      args:
        INSTALL_VISION: ${INSTALL_VISION:-false}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set URL-encoded PostgreSQL connection string in local .env}
      PRIVATE_MEDIA_DIR: /data/private_media
      COOKIE_SECURE: "true"
      MAX_IMAGE_BYTES: "5000000"
      MAX_REQUEST_BYTES: "6000000"
      API_ROOT_PATH: /api
      MODEL_CHECKPOINT: ${MODEL_CHECKPOINT:-}
      MODEL_APPROVED_SHA256: ${MODEL_APPROVED_SHA256:-}
      MODEL_CONFIDENCE_THRESHOLD: ${MODEL_CONFIDENCE_THRESHOLD:-}
      VALIDATED_EMBEDDING_MODEL_VERSION: ${VALIDATED_EMBEDDING_MODEL_VERSION:-}
    volumes:
      - private_media:/data/private_media
      - ./private_model:/data/model:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      BARANGAI_DOMAIN: ${BARANGAI_DOMAIN:?Set a DNS name pointing at this VM}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  private_media:
  caddy_data:
  caddy_config:
